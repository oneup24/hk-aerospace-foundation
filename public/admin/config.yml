# Decap CMS configuration for HATDF
# Docs: https://decapcms.org/docs/configuration-options/

backend:
  name: github
  repo: oneup24/hk-aerospace-foundation
  branch: main
  # OAuth via Netlify's free OAuth proxy (works for any static site)
  base_url: https://api.netlify.com
  auth_endpoint: auth/done
  # For production, replace these with a real GitHub OAuth App:
  # 1. GitHub Settings → Developer settings → OAuth Apps → New
  # 2. Homepage URL: https://oneup24.github.io/hk-aerospace-foundation/
  # 3. Callback URL: https://api.netlify.com/auth/done
  # 4. Copy Client ID / Secret, paste below, and enable in Netlify proxy UI
  open_authoring: false
  squash_merges: true
  commit_messages:
    create: 'cms: create {{collection}} "{{slug}}"'
    update: 'cms: update {{collection}} "{{slug}}"'
    delete: 'cms: delete {{collection}} "{{slug}}"'
    uploadMedia: 'cms: upload media {{path}}'
    deleteMedia: 'cms: delete media {{path}}'

# Site URL for preview
site_url: https://oneup24.github.io/hk-aerospace-foundation
display_url: https://oneup24.github.io/hk-aerospace-foundation
logo_url: https://oneup24.github.io/hk-aerospace-foundation/logo.png

locale: en

publish_mode: editorial_workflow

# Collections mirror src/content/news/{hk,zh,en}/*.md
collections:
  - name: news
    label: 'News & Insights'
    label_singular: 'Article'
    folder: src/content/news
    create: true
    delete: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    extension: md
    format: yaml-frontmatter
    media_folder: 'public/img/news'
    public_folder: '/img/news'
    summary: '{{title}} — {{category}} ({{date | date("YYYY-MM-DD")}})'
    sortable_fields: ['date', 'title', 'category']
    view_groups:
      - label: 'Category'
        field: 'category'
    fields:
      - { label: 'Title', name: 'title', widget: 'string' }
      - { label: 'Excerpt', name: 'excerpt', widget: 'text', hint: 'Short summary shown on list cards (~120 chars)' }
      - {
          label: 'Category',
          name: 'category',
          widget: 'select',
          options:
            [
              { label: 'Policy Decode (政策解讀)', value: '政策解讀' },
              { label: 'Trend Analysis (趨勢分析)', value: '趨勢分析' },
              { label: 'Deep Dive (深度分析)', value: '深度分析' },
              { label: 'Announcement (新聞公布)', value: '新聞公布' },
            ],
          default: '政策解讀',
        }
      - { label: 'Date', name: 'date', widget: 'datetime', format: 'YYYY-MM-DD', picker_utc: true }
      - { label: 'Author', name: 'author', widget: 'string', required: false, default: 'HATDF Editorial' }
      - {
          label: 'Reading Time (min)',
          name: 'readingMinutes',
          widget: 'number',
          required: false,
          min: 1,
          max: 30,
        }
      - {
          label: 'Keywords (SEO)',
          name: 'keywords',
          widget: 'list',
          required: false,
          hint: '2-4 search terms per article',
          field: { label: 'Keyword', name: 'keyword', widget: 'string' },
        }
      - {
          label: 'Body',
          name: 'body',
          widget: 'markdown',
          hint: 'Same markdown as before. Will be saved with the selected language folder below.',
        }
      # Language picker — controls which subfolder to write to
      - {
          label: 'Language (target folder)',
          name: 'lang',
          widget: 'hidden',
          default: 'hk',
        }
    # Translate plugin to manage 3-language versions
    # (Articles for /hk/, /zh/, /en/ must all share the same slug)
